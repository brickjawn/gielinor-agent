name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a dependency advisory published after your last commit is
    # exactly the case a push-triggered scan cannot catch. Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. A key committed three months ago and "removed" in the
          # next commit is still in the repo and still needs rotating; scanning
          # only the tip would miss it entirely.
          fetch-depth: 0

      # The binary, not gitleaks/gitleaks-action@v2. The action derives its scan
      # range from the event payload, and on a push it diffs `before..after` --
      # which on the first push to a fresh repo is the all-zeros SHA, so it tries
      # to diff from a commit that does not exist and fails in ~10s with nothing
      # to do with secrets. It also wants GITHUB_TOKEN and gates org-owned repos
      # behind a licence.
      #
      # Invoking the binary removes all of that: we say what to scan, the whole
      # history is scanned every run rather than an incremental range, no token
      # is handed to a third-party action, and the command is character-for-
      # character what runs in the pre-commit hook. Fewer moving parts in the
      # job whose entire purpose is to be trustworthy.
      #
      # Version is pinned and the download is checksum-verified. Dependabot does
      # not track raw release downloads, so this one needs bumping by hand --
      # noted here because a pin nobody updates is its own slow problem.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Download under the release filename, not a convenience name. The
          # checksums file references the release filename, so `sha256sum -c`
          # looks for exactly that on disk -- saving it as gitleaks.tar.gz makes
          # verification fail with "No such file or directory", which reads like
          # a broken download rather than a naming mismatch.
          curl -sSLf "${base}/${tarball}" -o "/tmp/${tarball}"
          curl -sSLf "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks.sums
          # grep finding no matching line exits non-zero and pipefail kills the
          # step, so an unrecognised filename fails closed rather than silently
          # skipping verification.
          ( cd /tmp && grep " ${tarball}\$" gitleaks.sums | sha256sum -c - )
          tar xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks version
          # Full history, not a commit range. A key committed months ago and
          # "removed" in the next commit is still in the repo and still needs
          # rotating; an incremental scan would never see it again.
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      # A second, dependency-free pass that also runs on every local `pytest`.
      # gitleaks is the better scanner, but a check that only exists in CI is a
      # check you find out about after pushing.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[dev]"
          python -m pytest tests/test_safety_invariants.py tests/test_secrets.py -q

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      # Non-blocking on purpose. A transitive advisory with no available fix
      # should not stop you shipping unrelated work; it should be visible. If
      # this becomes a rubber stamp nobody reads, make it blocking instead.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit --strict --desc

  static-analysis:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]"

      # ruff already runs bandit's rule set via its S ruleset, so this is
      # belt-and-braces and scoped to medium severity to stay signal-heavy.
      # It exists mainly because bandit's own release cadence sometimes carries
      # a new check before ruff mirrors it.
      - name: bandit
        run: bandit -c pyproject.toml -r src/gielinor -ll
